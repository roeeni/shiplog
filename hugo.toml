baseURL = "https://roeeni.github.io/shiplog/"
languageCode = "en-us"
title = "Ship Log"
theme = "PaperMod"
pagination.pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
description = "Build-in-public log — every project documented with TL;DR and technical details."
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowRssButton = true
DateFormat = "Jan 2, 2006"
mainSections = ["posts"]
author = "Roee"

[params.homeInfoParams]
Title = "Ship Log"
Content = "Every project, documented. TL;DR plus the technical stuff."

[params.editPost]
URL = "https://github.com/roeeni/shiplog/tree/master/content/posts"
Text = "Suggest a change"
appendFilePath = true

[markup.highlight]
noClasses = false

[taxonomies]
tag = "tags"

[outputs]
home = ["HTML", "RSS", "JSON"]
